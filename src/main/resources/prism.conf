# ==============================================================================
# Prism Configuration
# Modern Velocity Proxy Orchestration Platform
#
# Do not downgrade config-version — migrations run forward only.
# Missing keys always fall back to built-in defaults, so you can delete any
# section you don't need to customize (same philosophy as Paper/Purpur configs).
# ==============================================================================

config-version = 4

# ------------------------------------------------------------------------------
# Server pools with weighted load balancing
# ------------------------------------------------------------------------------
pools = [
    {
        name = "lobby"
        servers = [
            { name = "lobby-1", host = "127.0.0.1", port = 25565, weight = 10, fallback = true }
        ]
        fallback = "fallback"
    },
    {
        name = "survival"
        servers = [
            { name = "survival-1", host = "127.0.0.1", port = 25566, weight = 5 },
            { name = "survival-2", host = "127.0.0.1", port = 25567, weight = 5 },
        ]
        fallback = "lobby"
    },
    {
        name = "creative"
        servers = [
            { name = "creative-1", host = "127.0.0.1", port = 25568, weight = 10 },
        ]
        fallback = "lobby"
    },
    {
        name = "minigames"
        servers = [
            { name = "minigames-1", host = "127.0.0.1", port = 25569, weight = 3 },
            { name = "minigames-2", host = "127.0.0.1", port = 25570, weight = 3 },
            { name = "minigames-3", host = "127.0.0.1", port = 25571, weight = 3 },
        ]
        fallback = "lobby"
    },
    {
        name = "fallback"
        servers = [
            { name = "fallback-1", host = "127.0.0.1", port = 25572, weight = 1, fallback = true }
        ]
    }
]

# ------------------------------------------------------------------------------
# Fallback chain for when players are kicked or servers go down
# "default" must be an actual server name (e.g. fallback-1), not a pool name
# ------------------------------------------------------------------------------
fallback = {
    chain = ["lobby", "fallback"]
    default = "fallback-1"
}

# ------------------------------------------------------------------------------
# Health check configuration
# Downtime is detected after roughly: interval × fail-threshold
# ------------------------------------------------------------------------------
health-check = {
    enabled = true
    interval = 15          # seconds between check rounds
    timeout = 5000         # milliseconds before a ping counts as failed
    fail-threshold = 2     # consecutive failures before a server is marked offline
    success-threshold = 3  # consecutive successes before it comes back online
}

# ------------------------------------------------------------------------------
# Database configuration (PostgreSQL, MySQL, SQLite)
# Leave jdbc-url empty to disable persistence entirely.
# ------------------------------------------------------------------------------
database = {
    jdbc-url = "jdbc:postgresql://localhost:5432/prism"
    username = "prism"
    password = "changeme"
    driver = "org.postgresql.Driver"
    max-pool-size = 20
    min-idle = 5
}

# ------------------------------------------------------------------------------
# Redis configuration (cross-proxy sync, caching, sessions)
# Leave url empty to disable cross-proxy sync entirely.
# ------------------------------------------------------------------------------
redis = {
    url = "redis://localhost:6379"
    password = ""
    database = 0
    pool-size = 20
}

# ------------------------------------------------------------------------------
# WebSocket API configuration
# ------------------------------------------------------------------------------
api = {
    host = "0.0.0.0"
    port = 8080
    enabled = true
    jwt-secret = "changeme-generatesecurekey"
    cors-enabled = true

    # Simple per-remote-address rate limiter for API endpoints
    rate-limit-enabled = true
    rate-limit-per-minute = 120
}

# ------------------------------------------------------------------------------
# Logging configuration
# ------------------------------------------------------------------------------
logging = {
    level = "INFO"
    json-format = false
    loki-url = ""
}

# ==============================================================================
# Purpur-style granular sections — tune Prism subsystem by subsystem.
# Every key below has a built-in default; uncomment only what you customize.
# ==============================================================================

# ------------------------------------------------------------------------------
# chat.* — proxy-level chat handling
# format supports MiniMessage tags and {prefix} / {player} / {message} placeholders
# ------------------------------------------------------------------------------
chat = {
    enabled = true
    format = "[{prefix}] <{player}> {message}"
    default-prefix = "Player"              # used when the player has no prism.prefix.* permission
    send-to-console = true                 # mirror chat to the proxy console
    history-size = 1000                    # messages kept in the in-memory history ring
    ignore-mute-permission = "prism.chat.bypass-mute"  # holders of this permission may chat while muted

    channels = {
        enabled = false                    # enable named chat channels
        default-channel = "global"
        cross-proxy = true                 # relay channel messages across proxies via Redis
        list = ["global", "staff"]
    }
}

# ------------------------------------------------------------------------------
# players.* — player data and join/quit behaviour
# ------------------------------------------------------------------------------
players = {
    auto-register = true                   # register players in the database on first join
    save-interval-seconds = 300            # periodic flush interval for cached player data
    cache-expiry-minutes = 60              # how long player data stays cached after quit
    playtime-tracking = true               # accumulate playtime per player
    announce-joins = false                 # broadcast join messages proxy-wide
    announce-quits = false                 # broadcast quit messages proxy-wide
    # first-join-message = "<gold>Welcome <player> to the network!</gold>"
    default-locale = "en_us"
}

# ------------------------------------------------------------------------------
# commands.* — command registration and UX
# ------------------------------------------------------------------------------
commands = {
    server-command = true                  # register /server
    glist-command = true                   # register /glist
    admin-aliases = ["p", "proxyadmin", "proxy"]  # aliases for the /prism admin command
    permission-on-deny-message = "You don't have permission to use this command."
    cooldown-seconds = 0                   # per-player cooldown on /server (0 = disabled)
    blocked-commands = []                  # commands players may not run on the proxy
    blocked-bypass-permission = "prism.command.bypass-blocked"
}

# ------------------------------------------------------------------------------
# lifecycle.* — backend server drain / restart / crash behaviour
# Drain: /prism drain <pool> moves every player to the fallback chain and stops
#        new joins; after drain-timeout anyone still stuck is force-moved.
# Auto-restart: when crash-threshold crashes happen within restart-cooldown,
#        restart-command is executed (empty = just monitor, external supervisor
#        handles it) and the pool is watched for recovery up to
#        health-wait-timeout before being left offline.
# ------------------------------------------------------------------------------
lifecycle = {
    drain-timeout-seconds = 60             # max wait when draining a server before force-moving players
    drain-kick-message = "This server is going down for maintenance — you were moved to a fallback server."
    restart-cooldown-seconds = 90          # minimum time between restarts of the same server
    auto-restart = false                   # attempt automatic restarts for crashed backends
    crash-threshold = 3                    # crashes within the cooldown window before a restart triggers
    crash-restart-delay-seconds = 10       # delay between a crash and the restart attempt
    health-wait-timeout-seconds = 300      # max wait for a restarted server to pass health checks
    restart-command = ""                   # shell command run to restart a crashed backend, e.g. "systemctl restart mc-survival"
}

# ------------------------------------------------------------------------------
# sync.* — cross-proxy sync over Redis
# ------------------------------------------------------------------------------
sync = {
    enabled = true
    announce-health = true                 # broadcast health transitions to other proxies
    announce-player-switches = true        # broadcast player server switches to other proxies
    announce-lifecycle = true              # broadcast proxy start/stop status
    event-queue-size = 1000                # internal buffer for outgoing sync events
    connect-timeout-seconds = 5            # timeout for the initial Redis subscribe
    publish-timeout-seconds = 2            # timeout for each event publish
    player-data-ttl-minutes = 1440         # TTL for player presence keys in Redis
}

# ------------------------------------------------------------------------------
# metrics.* — metrics exposure
# ------------------------------------------------------------------------------
metrics = {
    enabled = true
    bind-jvm-metrics = true                # expose JVM memory/threads/GC metrics
    bind-pool-metrics = true               # expose per-pool health/size metrics
    histogram-max-age-seconds = 600        # ring-buffer age for latency histograms
    push-gateway-url = ""                  # optional Prometheus Pushgateway URL (empty = disabled)
    push-interval-seconds = 60             # push interval when a gateway is configured
}

# ------------------------------------------------------------------------------
# advanced.* — low-level engine toggles
# ------------------------------------------------------------------------------
advanced = {
    connection-timeout-millis = 3000       # timeout for backend connections
    health-ping-concurrency = 0            # max parallel pings per round (0 = unlimited)
    log-health-debug = false               # extra debug logging in the health checker
    cache-expiry-minutes = 30              # general internal cache expiry
    bungee-plugin-message-channel = true   # keep the legacy BungeeCord plugin messaging channel enabled
    allow-spectator-ping = false
    disable-proxy-idle-kick = true
}

# ------------------------------------------------------------------------------
# messages.* — every player-facing string, MiniMessage-formattable.
# Placeholders: <server> <pool> <target> <player> <error> <pools> <servers>
# ------------------------------------------------------------------------------
messages = {
    prefix = "<gray>[<aqua>Prism</aqua>]</gray> "
    fallback-redirect = "<gray>The server you were on is unavailable — moved you to <aqua><server></aqua>.</gray>"
    no-fallback-kick = "<red>You were disconnected because the server you were playing on went down, and no fallback server is currently available. Please try again shortly.</red>"
    server-offline = "<red>Server <server> is currently offline.</red>"
    no-healthy-servers = "<red>No healthy servers in pool <pool> right now.</red>"
    already-connected = "<yellow>You are already connected to <server>!</yellow>"
    already-in-pool = "<yellow>You are already in pool <pool>!</yellow>"
    connect-success = "<green>Connected to <target> → <server></green>"
    connect-failed = "<red>Failed to connect to <target>.</red>"
    muted = "<red>You are muted!</red>"
    reload-success = "<green>Prism config reloaded: <pools> pools, <servers> servers registered.</green>"
    reload-failed = "<red>Reload failed: <error>. Previous config kept.</red>"
}

# ---------------------------------------------------------------------------
# embedded-world — Prism's BUILT-IN world server (server-software mode).
# When enabled, Prism hosts its own playable world in-process (via Minestom)
# and registers it as a regular server in the pool — no Paper/backend needed.
# Players can walk, jump, and place/break blocks in this world.
# ---------------------------------------------------------------------------
embedded-world {
    # Enable the built-in world server.
    enabled = false
    # Name as it appears in pools/commands (e.g. /server prism-world)
    server-name = "prism-world"
    # Bind address — keep 127.0.0.1 so only the proxy itself talks to it
    host = "127.0.0.1"
    # Port for the embedded listener (must not clash with other servers)
    port = 25580
    # Brand shown in the client F3 debug screen when playing in this world
    brand-name = "Prism"
    # Which pool the embedded world joins (created if it doesn't exist)
    pool = "lobby"
    # Where players spawn in the built-in world
    spawn-x = 0.5
    spawn-y = 42.0
    spawn-z = 0.5
    # Velocity modern forwarding secret file (relative to proxy working dir).
    # The built-in world sits behind Prism itself, so forwarded logins are
    # expected when this file exists (same secret as velocity.toml).
    forwarding-secret-file = "forwarding.secret"
    generation {
        # Terrain type: "flat" (grass platform)
        type = "flat"
        # Ground height for flat generation
        height = 40
    }
}
